name: Generate llms.txt with llms.ink
description: Generate and check llms.txt, report what AI agents see on your site, fix it in PRs, ping IndexNow and keep dependency docs current, with llms.ink.
author: lukax
branding:
  icon: file-text
  color: blue

inputs:
  inspect-dir:
    description: 'inspect-context mode only: explicit directory whose entire UTF-8 .md/.txt/.json file set is sent to llms.ink. Includes nested files and local notes. Requires an inspection-enabled api-key. No default, links or automatic generation.'
    default: ''
  inspect-paths:
    description: 'Opt-in hosted inspection: 1–20 explicit .md, .txt or .json file paths, one per line. No globs or symlinks. File content is sent to llms.ink; requires an inspection-enabled api-key.'
    default: ''
  url:
    description: The site, docs section, page or GitHub repo to generate for (or to check or report on), e.g. https://example.com or https://github.com/owner/repo. Required in every mode but `context`, `inspect` and `inspect-context`.
    required: false
  path:
    description: Where to write llms.txt (default `llms.txt`). In `commit` and `pr` modes, a path inside the repository; in `comment` mode, the file to compare against; in `check` mode, the file to lint, only when set explicitly (see `check-target`).
    default: ''
  full-path:
    description: Where to write llms-full.txt (the index followed by the Markdown of up to 20 linked pages). Leave empty to skip it. Not used in `check` and `comment` modes.
    default: ''
  fresh:
    description: Rebuild instead of using llms.ink's cache (results are cached for 24 hours). Each rebuild counts against the daily quota (60 per IP address without a key).
    default: 'true'
  mode:
    description: '`inspect-context` explicitly scans an entire directory and produces an unsigned CLI manifest; `inspect` scans explicitly named files via the hosted pilot (both fail on findings or incomplete inspection); `write` the file (default); `commit` it to the branch when it changed; open or update a `pr`; `check` llms.txt (the file at `path` in the checkout, or the one the site publishes) and fail on errors or broken links; `comment` the section diff on a pull request; `aeo` reports what AI agents see at `url` (annotations, job summary, a pull request comment) and fails per `aeo-fail-on`; `context` refreshes version-pinned dependency docs in `context-dir` and opens a pull request; `indexnow` only submits changed URLs to IndexNow.'
    default: write
  api-key:
    description: 'Optional llms.ink API key (`lk_…`), sent as `Authorization: Bearer`. Gives the job its own daily quota instead of the runner''s shared IP quota. Use a secret, e.g. secrets.LLMS_INK_KEY.'
    default: ''
  generated:
    description: 'Always generate, never copy the site''s own llms.txt (sends `native=0`). Set it to `true` when your /llms.txt is served from llms.ink.'
    default: 'false'
  commit-message:
    description: Commit message in `commit`, `pr`, `context` and `autofix`; also the pull request title. Default `Update llms.txt` (`Fix agent access (llms.ink report)` with `autofix`, `Update dependency docs in .context` in `context` mode).
    default: ''
  branch:
    description: '`commit` mode: the branch to commit to (default: the branch the workflow runs on). `pr`, `context` and `autofix`: the branch the pull request is opened from (default: llms-ink/llms-txt, llms-ink/context, llms-ink/aeo-fixes).'
    default: ''
  token:
    description: GitHub token for `commit`, `pr` and `comment` modes. Commits pushed with the default token don't start other workflows; pass a personal access token or GitHub App token for that.
    default: ${{ github.token }}
  check-target:
    description: '`check` mode: `auto` lints the file at `path` when `path` is set and the file exists in the workspace, and otherwise checks the llms.txt the site at `url` publishes; `file` always lints the file at `path` (default `llms.txt`; fails when it''s missing); `live` always checks the site.'
    default: auto
  links:
    description: '`check` mode on a file: also check up to 25 linked URLs and llms-full.txt next to `url`. The live check always checks links.'
    default: 'true'
  aeo-fail-on:
    description: '`aeo` mode: `fail` (default) fails the job when any check fails; `warn` also on warnings; `none` never (report only).'
    default: fail
  autofix:
    description: '`aeo` mode: open or update a pull request applying the report''s robots.txt, `_headers` and llms.txt fixes. Nothing else is ever changed. Needs `contents: write` and `pull-requests: write`.'
    default: 'false'
  autofix-dir:
    description: '`autofix`: the folder fixed files go in (e.g. `public`). Default: next to the existing file, else `public/` or `static/` when the repo has one, else the root.'
    default: ''
  issue:
    description: '`aeo` mode, off pull requests (a schedule or a deploy): keep one issue labelled `llms-ink` open while the report has failures (warnings too with `aeo-fail-on: warn`), updated in place, and close it when they are gone. Needs `issues: write`.'
    default: 'false'
  indexnow-key:
    description: 'Submit changed URLs of `url`''s site to IndexNow (Bing, Yandex, Seznam, Naver, Yep…) after a non-inspection mode succeeds. Ignored by inspect and inspect-context. The key must be served at https://<site>/<key>.txt (checked first); mode: indexnow does only this.'
    default: ''
  indexnow-urls:
    description: 'URLs (or paths) to submit, one per line or comma-separated. Default: the pages the deployed or pushed commit changed, matched against the site''s sitemap.'
    default: ''
  indexnow-key-location:
    description: Where the key file is, when not at /<key>.txt (same host).
    default: ''
  context-dir:
    description: '`context` mode: the folder `llms-ink context` writes (`--out`).'
    default: .context
  context-max:
    description: '`context` mode: the most dependencies to document (`--max`).'
    default: '10'
  manifests:
    description: '`context` mode: manifests or lockfiles to read (`--manifest`), one per line. Default: what the CLI finds in the repository.'
    default: ''
  agents-md:
    description: '`context` mode: the file whose llms-ink context block is kept current (`--agents-md`). `none` to skip it.'
    default: AGENTS.md

outputs:
  inspection-status:
    description: 'inspect-context: local pack freshness at verification (current, stale or invalid). Current alone does not mean inspection passed.'
    value: ${{ steps.llms.outputs.inspection-status }}
  inspection-recommendation:
    description: 'inspect-context: continue only when the scan and current-pack verification passed without interruption; otherwise withhold. Also require step success.'
    value: ${{ steps.llms.outputs.inspection-recommendation }}
  inspection-not-attempted:
    description: 'inspect-context: files not submitted after the scan stopped. Separate from attempted unknown results.'
    value: ${{ steps.llms.outputs.inspection-not-attempted }}
  inspection-report:
    description: 'Path to JSON receipts in the runner temp directory; inspect-context produces a CLI-compatible unsigned manifest. No source text; filenames/source URLs may be sensitive.'
    value: ${{ steps.llms.outputs.inspection-report }}
  inspection-flagged:
    description: 'Files flagged by hosted inspection.'
    value: ${{ steps.llms.outputs.inspection-flagged }}
  inspection-unknown:
    description: 'Attempted files without a complete inspection decision; inspect-context reports unattempted files separately.'
    value: ${{ steps.llms.outputs.inspection-unknown }}
  inspection-clean:
    description: 'Files completely inspected without findings; not a safety guarantee.'
    value: ${{ steps.llms.outputs.inspection-clean }}
  changed:
    description: '`true` when the generated file differs from the previous one: the file on disk (`write`, `comment`) or on the branch (`commit`, `pr`); in `context` mode and with `autofix`, when the pull request has changes. Always `false` in `check` mode.'
    value: ${{ steps.llms.outputs.changed }}
  tokens:
    description: Estimated tokens in llms.txt (in `check` mode, in the published file).
    value: ${{ steps.llms.outputs.tokens }}
  path:
    description: Where llms.txt was written; empty in `check` and `comment` modes.
    value: ${{ steps.llms.outputs.path }}
  pr-url:
    description: The pull request opened or updated in `pr` and `context` modes and by `autofix` (or the open one, when nothing changed).
    value: ${{ steps.llms.outputs.pr-url }}
  issue-url:
    description: '`aeo` mode with `issue`: the tracking issue opened, updated or closed by this run (empty when there was nothing to report).'
    value: ${{ steps.llms.outputs.issue-url }}
  source:
    description: '`generated` when llms.ink wrote the file; `native` when the site publishes its own llms.txt, which is copied as is.'
    value: ${{ steps.llms.outputs.source }}
  pages:
    description: How many links llms.txt covers.
    value: ${{ steps.llms.outputs.pages }}
  aeo-fail:
    description: '`aeo` mode: how many checks failed.'
    value: ${{ steps.llms.outputs.aeo-fail }}
  aeo-warn:
    description: '`aeo` mode: how many checks warned.'
    value: ${{ steps.llms.outputs.aeo-warn }}
  indexnow-submitted:
    description: How many URLs were submitted to IndexNow (empty without `indexnow-key`).
    value: ${{ steps.llms.outputs.indexnow-submitted }}

runs:
  using: composite
  steps:
    - id: llms
      shell: bash
      env:
        INPUT_INSPECT_DIR: ${{ inputs.inspect-dir }}
        INPUT_INSPECT_PATHS: ${{ inputs.inspect-paths }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FULL_PATH: ${{ inputs.full-path }}
        INPUT_FRESH: ${{ inputs.fresh }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_GENERATED: ${{ inputs.generated }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_CHECK_TARGET: ${{ inputs.check-target }}
        INPUT_LINKS: ${{ inputs.links }}
        INPUT_AEO_FAIL_ON: ${{ inputs.aeo-fail-on }}
        INPUT_AUTOFIX: ${{ inputs.autofix }}
        INPUT_AUTOFIX_DIR: ${{ inputs.autofix-dir }}
        INPUT_ISSUE: ${{ inputs.issue }}
        INPUT_INDEXNOW_KEY: ${{ inputs.indexnow-key }}
        INPUT_INDEXNOW_URLS: ${{ inputs.indexnow-urls }}
        INPUT_INDEXNOW_KEY_LOCATION: ${{ inputs.indexnow-key-location }}
        INPUT_CONTEXT_DIR: ${{ inputs.context-dir }}
        INPUT_CONTEXT_MAX: ${{ inputs.context-max }}
        INPUT_MANIFESTS: ${{ inputs.manifests }}
        INPUT_AGENTS_MD: ${{ inputs.agents-md }}
      run: |
        command -v node >/dev/null || { echo '::error title=llms.ink::Node.js 20 or later is required on the runner.'; exit 1; }
        node "$GITHUB_ACTION_PATH/src/main.mjs"
